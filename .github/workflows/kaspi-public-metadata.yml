name: Kaspi public metadata inspection
on:
  pull_request:
    paths:
      - 'kaspi_public_metadata_diagnostic.py'
      - '.github/workflows/kaspi-public-metadata.yml'
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect one public product page
        run: python kaspi_public_metadata_diagnostic.py

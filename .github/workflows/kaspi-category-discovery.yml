name: Kaspi category discovery diagnostic
on:
  pull_request:
    paths:
      - 'kaspi_category_diagnostic.py'
      - '.github/workflows/kaspi-category-discovery.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python kaspi_category_diagnostic.py
